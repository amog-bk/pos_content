name: Weekly insurance briefing

# Scrapes the Indian insurance market weekly and writes ranked briefing
# material (digest + per-section material) into roundups/<YYYY-Www>/.
# The final briefing is written in-session in BimaKavach voice from this
# material.

on:
  schedule:
    # Every Friday 02:30 UTC = 08:00 IST, so material is fresh for the
    # Friday briefing.
    - cron: "30 2 * * 5"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week label (e.g. 2026-W22). Leave blank for current week."
        required: false
        default: ""
      min_score:
        description: "Minimum classifier score for inclusion"
        required: false
        default: "6"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GOOGLE_SHEETS_SA_JSON: ${{ secrets.GOOGLE_SHEETS_SA_JSON }}
          ROUNDUP_SHEET_ID: ${{ vars.ROUNDUP_SHEET_ID }}
        run: |
          WEEK_ARG=""
          if [ -n "${{ github.event.inputs.week }}" ]; then
            WEEK_ARG="--week ${{ github.event.inputs.week }}"
          fi
          MIN_SCORE="${{ github.event.inputs.min_score || '6' }}"
          python -m scraper.main $WEEK_ARG --min-score "$MIN_SCORE" -v

      - name: Commit briefing material
        run: |
          git config user.name "bimakavach-bot"
          git config user.email "bot@bimakavach.in"
          git add roundups/
          if git diff --cached --quiet; then
            echo "No new material to commit."
            exit 0
          fi
          WEEK=$(python -c "from scraper.main import week_label; print(week_label())")
          git commit -m "briefing: weekly material $WEEK"
          git push
