    categories: [claims, consumer]

  - id: irdai_news_gnews
    name: IRDAI in the News (via Google News)
    url: https://news.google.com/rss/search?q=IRDAI+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 5
    categories: [regulation]

  # Demoted to tier 3 — businessline_rss above is the direct feed. Keep as
  # backup; remove once the direct feed proves reliable.
  - id: businessline_insurance_gnews
    name: BusinessLine Insurance (via Google News)
    url: https://news.google.com/rss/search?q=site%3Athehindubusinessline.com+insurance&hl=en-IN&gl=IN&ceid=IN%3Aen
