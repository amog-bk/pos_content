# Source map for the weekly India business-insurance scraper.
# Edit `enabled: true|false` to add/remove sources from the next run.
# `parser` picks the scraping strategy; `tier` controls priority in the digest;
# `partner_relevance` (1-5) is a hint to the classifier — 5 = always include if matched.

defaults:
  user_agent: "Mozilla/5.0 (compatible; BimaKavachWeeklyBot/1.0; +https://bimakavach.in)"
  request_timeout_seconds: 20
  max_items_per_source: 15
  lookback_days: 7

sources:

  # -------- Tier 1: Regulatory --------
  - id: irdai_circulars
    name: IRDAI Circulars
    url: https://irdai.gov.in/circulars
    parser: irdai_listing
    tier: 1
    enabled: true
    partner_relevance: 5
    categories: [regulation]

  - id: irdai_industry_trends
    name: IRDAI Industry Trends
    url: https://irdai.gov.in/industry-trends
    parser: irdai_listing
    tier: 1
    enabled: true
    partner_relevance: 4
    categories: [stats, regulation]

  - id: irdai_exposure_drafts
    name: IRDAI Exposure Drafts
    url: https://irdai.gov.in/exposure-drafts
    parser: irdai_listing
    tier: 1
    enabled: true
    partner_relevance: 5
    categories: [regulation]

  # -------- Tier 1: Industry data --------
  # GIC Council and IIB both block automated traffic (403/timeout from
  # GitHub runners). Disabled until we find an alternative ingestion path
  # (their PDF data downloads may need a separate scheduled job).
  - id: gic_council
    name: General Insurance Council
    url: https://www.gicouncil.in
    parser: generic_html
    tier: 1
    enabled: false
    partner_relevance: 4
    categories: [stats, commercial]

  - id: iib
    name: Insurance Information Bureau
    url: https://iib.gov.in
    parser: generic_html
    tier: 1
    enabled: false
    partner_relevance: 3
    categories: [stats, claims, fraud]

  # -------- Tier 2: News --------
  - id: the_cession
    name: The Cession
    url: https://thecession.com
    parser: generic_html
    tier: 2
    enabled: true
    partner_relevance: 5
    categories: [regulation, commercial, reinsurance, insurtech]

  # ET / Business Standard / Moneycontrol block direct scraping. We use
  # Google News RSS as a reliable proxy — same domain, just discovered via
  # Google's index. Titles include " - Publication" suffix which our parser
  # strips and uses as the displayed source name.
  - id: et_insurance_gnews
    name: Economic Times (via Google News)
    url: https://news.google.com/rss/search?q=site%3Aeconomictimes.indiatimes.com+insurance&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [regulation, commercial, health]

  - id: business_standard_insurance_gnews
    name: Business Standard (via Google News)
    url: https://news.google.com/rss/search?q=site%3Abusiness-standard.com+insurance&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [regulation, commercial, financials]

  - id: moneycontrol_insurance_gnews
    name: Moneycontrol (via Google News)
    url: https://news.google.com/rss/search?q=site%3Amoneycontrol.com+insurance&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 3
    categories: [financials, commercial]

  - id: mint_insurance
    name: Mint Insurance
    url: https://www.livemint.com/insurance
    parser: generic_html
    tier: 2
    enabled: true
    partner_relevance: 3
    categories: [health, regulation]

  # Financial Express returned high noise (share-price pages) in Week-1.
  # Disabled until we have a tighter parser for it.
  - id: financial_express_insurance
    name: Financial Express Insurance
    url: https://www.financialexpress.com/about/insurance/
    parser: generic_html
    tier: 2
    enabled: false
    partner_relevance: 3
    categories: [regulation, reform]

  # Broad commercial-insurance topic feed across Indian news.
  - id: india_commercial_insurance_gnews
    name: Commercial Insurance India (via Google News)
    url: https://news.google.com/rss/search?q=%22commercial+insurance%22+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [commercial]

  - id: india_cyber_insurance_gnews
    name: Cyber Insurance India (via Google News)
    url: https://news.google.com/rss/search?q=%22cyber+insurance%22+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [cyber]

  # -------- Tier 2: Line-of-business topic feeds (Google News) --------
  # These give the roundup per-section coverage. Each is a free-text Google
  # News search restricted to India region. Disable any that produce noise
  # in the digest.

  - id: liability_gnews
    name: Liability Insurance India (via Google News)
    url: https://news.google.com/rss/search?q=%22liability+insurance%22+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [commercial_liability]

  - id: do_insurance_gnews
    name: D&O Insurance India (via Google News)
    url: https://news.google.com/rss/search?q=%22directors+and+officers%22+insurance+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [commercial_liability]

  - id: fire_insurance_gnews
    name: Fire Insurance India (via Google News)
    url: https://news.google.com/rss/search?q=%22fire+insurance%22+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [commercial_property]

  - id: marine_insurance_gnews
    name: Marine Insurance India (via Google News)
    url: https://news.google.com/rss/search?q=%22marine+insurance%22+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [commercial_marine]

  - id: engineering_insurance_gnews
    name: Engineering Insurance India (via Google News)
    url: https://news.google.com/rss/search?q=%22engineering+insurance%22+India+OR+%22CAR+policy%22+contractors&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [commercial_engineering]

  - id: workmen_comp_gnews
    name: Workmen Compensation India (via Google News)
    url: https://news.google.com/rss/search?q=%22workmen+compensation%22+OR+%22workers+compensation%22+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [employee_benefits]

  - id: group_health_gnews
    name: Group Health Insurance India (via Google News)
    url: https://news.google.com/rss/search?q=%22group+health+insurance%22+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [health_group]

  - id: sme_insurance_gnews
    name: SME / MSME Insurance India (via Google News)
    url: https://news.google.com/rss/search?q=%22SME+insurance%22+OR+%22MSME+insurance%22+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [commercial, stats]

  - id: insurance_fraud_gnews
    name: Insurance Fraud India (via Google News)
    url: https://news.google.com/rss/search?q=%22insurance+fraud%22+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [fraud, consumer]

  - id: insurance_claims_consumer_gnews
    name: Insurance Claims India (via Google News)
    url: https://news.google.com/rss/search?q=%22insurance+claim%22+India+%22consumer+commission%22+OR+%22ombudsman%22&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 4
    categories: [claims, consumer]

  - id: irdai_news_gnews
    name: IRDAI in the News (via Google News)
    url: https://news.google.com/rss/search?q=IRDAI+India&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 5
    categories: [regulation]

  - id: businessline_insurance_gnews
    name: BusinessLine Insurance (via Google News)
    url: https://news.google.com/rss/search?q=site%3Athehindubusinessline.com+insurance&hl=en-IN&gl=IN&ceid=IN%3Aen
    parser: google_news_rss
    tier: 2
    enabled: true
    partner_relevance: 3
    categories: [regulation, commercial, financials]

  # -------- Tier 3: Reinsurance & global --------
  - id: gic_re
    name: GIC Re
    url: https://www.gicre.in
    parser: generic_html
    tier: 3
    enabled: true
    partner_relevance: 2
    categories: [reinsurance, commercial]

  - id: swiss_re_institute
    name: Swiss Re Institute
    url: https://www.swissre.com/institute.html
    parser: generic_html
    tier: 3
    enabled: false   # global focus, low Partner relevance — opt-in
    partner_relevance: 2
    categories: [reinsurance, stats]

  - id: lloyds_insights
    name: Lloyd's Insights
    url: https://www.lloyds.com/about-lloyds/media-centre/insight
    parser: generic_html
    tier: 3
    enabled: false   # opt-in
    partner_relevance: 1
    categories: [reinsurance, commercial]

  # -------- Tier 3: Claims & consumer --------
  - id: bima_bharosa
    name: Bima Bharosa
    url: https://bimabharosa.irdai.gov.in
    parser: generic_html
    tier: 3
    enabled: true
    partner_relevance: 4
    categories: [claims, consumer]

  - id: ombudsman
    name: Insurance Ombudsman
    url: https://www.cioins.co.in
    parser: generic_html
    tier: 3
    enabled: true
    partner_relevance: 3
    categories: [claims, consumer]
